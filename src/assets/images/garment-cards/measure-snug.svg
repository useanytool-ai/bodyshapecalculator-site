    <text x="480.0" y="74" text-anchor="middle" fill="#0f0d08">✓ DO</text>
  </g>
  <text x="160.0" y="274" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#8a8a8a">Pulled tight, compressing skin</text>
  <text x="480.0" y="274" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e8c97a">Snug with room for one finger</text>
  <text x="160.0" y="294" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#8a8a8a">Reads smaller than your real</text><text x="160.0" y="311" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#8a8a8a">measurement</text>
  <text x="480.0" y="294" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9c2b2">Gives your true, repeatable</text><text x="480.0" y="311" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9c2b2">number</text>
