<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" width="640" height="740" role="img" aria-labelledby="t d">
<title id="t">Human body proportions: the eight-head figure</title>
<desc id="d">A schematic figure divided into eight equal head units, with landmarks: chin at 1, nipple line at 2, navel at 3, crotch at 4, knees at about 6, soles at 8.</desc>
<rect width="640" height="740" rx="18" fill="#111111"/>
<rect x="1" y="1" width="638" height="738" rx="17" fill="none" stroke="#2a2a2a"/>
<line x1="70" y1="40" x2="470" y2="40" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="45" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">0</text><text x="482" y="45" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Top of head</text><line x1="70" y1="120" x2="470" y2="120" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="125" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">1</text><text x="482" y="125" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Chin</text><line x1="70" y1="200" x2="470" y2="200" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="205" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">2</text><text x="482" y="205" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Nipple line</text><line x1="70" y1="280" x2="470" y2="280" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="285" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">3</text><text x="482" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Navel</text><line x1="70" y1="360" x2="470" y2="360" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="365" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">4</text><text x="482" y="365" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Crotch (midpoint)</text><line x1="70" y1="440" x2="470" y2="440" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="445" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">5</text><text x="482" y="445" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Mid-thigh</text><line x1="70" y1="520" x2="470" y2="520" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="525" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">6</text><text x="482" y="525" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Knees (about 5.5–6)</text><line x1="70" y1="600" x2="470" y2="600" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="605" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">7</text><text x="482" y="605" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Mid-calf</text><line x1="70" y1="680" x2="470" y2="680" stroke="#c9a84c" stroke-opacity=".45" stroke-dasharray="5 5"/><text x="58" y="685" text-anchor="end" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#e8c97a">8</text><text x="482" y="685" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cfc8b8">Soles of the feet</text>

